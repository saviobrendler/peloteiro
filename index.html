if (e) e.addEventListener('click', aoClicar);
}
document.addEventListener('keydown', aoTeclar);
document.addEventListener('beforeinput', aoPreDigitar);
document.addEventListener('input', aoDigitar);
document.addEventListener('compositionend', aoComporFim);
document.addEventListener('change', aoMudar);
armazem.ouvir(aoArmazenar);
window.addEventListener('resize', () => { if (app.tela === 'mercado') { telaMercado.papeis(); telaMercado.ajustar(); } });
try {
window.matchMedia('(min-width: 600px)').addEventListener('change', e => {
for (const f of document.querySelectorAll('.elenco-grade .fig')) f.classList.toggle('fig--cheia', e.matches);
});
window.matchMedia('(min-width: 900px)').addEventListener('change', () => {
if (app.tela === 'copa') telaCopa.ordenar();
if (app.tela === 'mercado') { telaMercado.papeis(); telaMercado.ajustar(); }
});
} catch (e) {   }
}
function restaurarSeguro(x) {
try { const r = P.restaurar(x); return r && typeof r === 'object' ? r : { ok: false, motivo: 'formato' }; } catch (e) { return { ok: false, motivo: 'formato' }; }
}
let iniciado = false;
function iniciar(data) {
document.documentElement.lang = 'pt-BR';
const raizApp = document.getElementById('app');
if (!P || !raizApp) { if (raizApp) trocar(raizApp, h('p.vazio', 'Não deu para carregar o jogo. Recarregue a página.')); return; }
data = data && typeof data === 'object' ? data : {};
app.prefs = lerPrefs(armazem.ler(CH.prefs) || data.prefs);
const ta = lerTelaSalva(armazem.lerSessao(CH.tela)) || app.prefs.telaAtual || {};
app.recordes = lerRecordes(data.recordes);
som.preferir(app.prefs.som !== false);
let r = { ok: false, motivo: 'vazio' }, motivoFalha = null;
if (data.campanha != null) { r = restaurarSeguro(data.campanha); if (!r.ok && r.motivo !== 'vazio') motivoFalha = r.motivo; }
if (!r.ok) {
const salvo = armazem.lerTexto(CH.campanha);
if (salvo != null) {
const r2 = restaurarSeguro(salvo);
if (r2.ok) { r = r2; motivoFalha = null; } else { if (r2.motivo !== 'vazio') motivoFalha = r2.motivo; armazem.apagar(CH.campanha); }
}
}
if (r.ok && r.estado) app.estado = r.estado;
else if (motivoFalha) app.avisoRestauracao = motivoFalha === 'dados' ? TXT.dados : TXT.versao;
if (app.estado && app.estado.fase === 'fim') registrarSeNecessario(app.estado, lerResumo(app.estado));  
const ui = data.ui && typeof data.ui === 'object' ? data.ui : {};
if (ui.abaMercado === 'sorteio' || ui.abaMercado === 'time') app.abaMercado = ui.abaMercado;
if (['grupo', 'chave', 'time'].includes(ui.abaCopa)) app.abaCopa = ui.abaCopa;
else if (app.estado && app.estado.fase === 'copa' && !/^g/.test(app.estado.copa.rodada)) app.abaCopa = 'chave';  
app.partidaVista = typeof ui.partidaVista === 'string' ? ui.partidaVista : typeof ta.partidaVista === 'string' ? ta.partidaVista : null;
const pedida = typeof ui.tela === 'string' ? ui.tela : ta.tela;
let tela = 'inicio';
if (app.estado) tela = pedida === 'inicio' ? 'inicio' : telaDoEstado(app.estado, pedida, app.partidaVista);
if (tela === 'fim') app.partidaVista = null;
dialogos.iniciar();
montarTopo();
ouvir();
trocarTela(tela, { inicial: true });
if (app.avisoRestauracao && tela === 'inicio') anunciar(app.avisoRestauracao);
if (ESCUDOS.size) {
try { if (typeof window.requestIdleCallback === 'function') window.requestIdleCallback(preCarregarEscudos, { timeout: 1500 }); else agenda.depois(600, preCarregarEscudos, 'global'); }
catch (e) { agenda.depois(600, preCarregarEscudos, 'global'); }
}
}
function start(data) {
if (iniciado) return;
iniciado = true;
try { iniciar(data); } catch (e) { console.error(e); try { avisos.mostrar(TXT.erro, { erro: true }); } catch (e2) {   } }
}
try {
window.claude?.hot?.snapshot(() => ({ v: 2, campanha: app.estado && P ? P.serializar(app.estado) : null,
ui: { tela: app.tela, abaCopa: app.abaCopa, abaMercado: app.abaMercado, partidaVista: app.partidaVista },
recordes: app.recordes, prefs: app.prefs }));
} catch (e) { console.error(e); }
try { window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}); } catch (e) { console.error(e); start({}); }
})();
</script>
